name: Crypto 24-7 Bot Runner

# 設定觸發條件
on:
  schedule:
    # 每 5 分鐘自動執行一次（可依照你的短波段頻率調整）
    - cron: '*/5 * * * *'
  workflow_dispatch: # 允許你手動在 GitHub 網頁上點擊執行測試

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. 把專案程式碼拉到虛擬機
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安裝必要套件 (依據你的 requirements.txt)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy sqlalchemy psycopg2-binary ccxt requests

    # 4. 執行你的 Python 主程式，並把 GitHub Secrets 帶入環境變數
    - name: Run Trading Bot
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python bot.py
