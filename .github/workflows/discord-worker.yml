name: Crypto Signal Cron Worker

on:
  schedule:
    # 每小時執行一次 (可依需求調整 cron 語法)
    - cron: '0 * * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crypto_signal_bridge/requirements.txt

      - name: Run Signal Scanner & Discord Worker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          from crypto_signal_bridge.okx_signal_scanner import OKXSignalScanner
          from crypto_signal_bridge.discord_worker import DiscordWorker
          
          scanner = OKXSignalScanner()
          worker = DiscordWorker()
          
          for sym in ['BTC/USDT:USDT', 'ETH/USDT:USDT']:
              res = scanner.check_signals(sym)
              print(f'Checking {sym}: {res}')
              if res and res.get('signal'):
                  worker.send_signal_alert(
                      symbol=res['symbol'],
                      indicator='EMA Cross Workflow',
                      action=res['action'],
                      price=res['price']
                  )
          "
