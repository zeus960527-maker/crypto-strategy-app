name: BTC ETH AI Scanner and Discord Worker

on:
  # 保留手動點擊執行的按鈕
  workflow_dispatch:

  # 設定每 1 分鐘自動定時觸發
  schedule:
    - cron: '*/1 * * * *'

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests sqlalchemy psycopg2-binary pandas numpy lightgbm pillow

      - name: Step 1 - Run OKX Signal Scanner
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python okx_signal_scanner.py  # 如果檔案在子資料夾請改為 python crypto_signal_bridge/okx_signal_scanner.py

      - name: Step 2 - Run Trader Bot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python trader_bot.py  # 如果檔案在子資料夾請改為 python crypto_signal_bridge/trader_bot.py
